name: Rebuild on Sanity publish

# Sanity content is read only at build time. Every 10 minutes, ask Sanity when
# content was last published and redeploy if that's newer than the last
# successful deploy. Uses the public dataset and the workflow's own token, so
# no secrets are needed (a Sanity webhook would need a GitHub PAT).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: sanity-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Redeploy if Sanity changed since the last deploy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
        run: |
          set -euo pipefail
          query='*[!(_id in path("drafts.**")) && !(_type match "system.*") && !(_type match "sanity.*")]|order(_updatedAt desc)[0]._updatedAt'
          published=$(curl -fsSG "https://${PROJECT_ID}.api.sanity.io/v2026-07-01/data/query/${DATASET}" \
            --data-urlencode "query=${query}" | jq -r '.result // empty')
          deployed=$(gh run list --workflow deploy.yml --status success --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          running=$(gh run list --workflow deploy.yml --limit 5 --json status --jq '[.[] | select(.status != "completed")] | length')
          echo "Last Sanity publish: ${published:-none}"
          echo "Last successful deploy started: ${deployed:-never}"
          if [ "$running" != "0" ]; then echo "A deploy is already running."; exit 0; fi
          if [ -n "$published" ] && { [ -z "$deployed" ] || [[ "$published" > "$deployed" ]]; }; then
            echo "Sanity is newer; redeploying."
            gh workflow run deploy.yml --ref main
          else
            echo "Site is up to date."
          fi
